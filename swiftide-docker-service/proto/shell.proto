syntax = "proto3";

package shell;

// The gRPC service definition.
service ShellExecutor {
  // Runs a shell command and streams its raw combined output.
  rpc ExecShell (ShellRequest) returns (stream ShellEvent) {}
}

// The request message containing the command to run.
message ShellRequest {
  string command = 1;

  bool env_clear = 3;
  repeated string env_remove = 4;
  map<string, string> envs = 5;

  // Optional timeout in milliseconds for the command execution.
  optional uint64 timeout_ms = 6;

  // Optional working directory for the command execution.
  optional string cwd = 7;
}

message ShellEvent {
  oneof event {
    bytes output = 1;
    ShellResult result = 2;
  }
}

message ShellResult {
  oneof outcome {
    int32 exit_code = 1;
    uint64 timed_out_after_ms = 2;
  }
}
