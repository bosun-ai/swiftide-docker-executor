[package]
name = "swiftide-docker-service"
build = "build.rs"
publish = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
description.workspace = true
categories.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic.workspace = true
prost.workspace = true
bytes.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3" }
futures-util.workspace = true
async-stream.workspace = true
tempfile = "3"
process-wrap = { version = "9", default-features = false, features = ["process-group", "tokio1"] }

swiftide-indexing = { workspace = true, optional = true }
swiftide-core = { workspace = true, optional = true }
landlock = "0.4.7"
libc = "0.2"
seccompiler = "0.5.0"

[build-dependencies]
tonic-prost-build = { workspace = true }

[features]
default = ["file-loader"]
file-loader = ["dep:swiftide-indexing", "dep:swiftide-core"]

[dev-dependencies]
indoc = "2"
